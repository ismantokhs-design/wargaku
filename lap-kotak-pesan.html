<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Kotak Pesan - WargaKu PWA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <style>
        body {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- Kontainer Utama Tampilan Mobile / PWA -->
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col justify-between relative overflow-x-hidden pb-28" style="background-color: #f0fdf4;">
        
        <!-- Header Halaman -->
        <header class="px-6 pt-6 pb-5 flex justify-between items-center bg-gradient-to-br from-emerald-600 via-emerald-700 to-teal-800 sticky top-0 z-40 shadow-lg rounded-b-3xl">
            <div class="flex items-center space-x-3">
                <a href="laporan.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur-md text-white flex items-center justify-center hover:bg-white/30 transition shadow-inner border border-white/30">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-lg font-bold text-white tracking-wide">Rekap Kotak Pesan</h1>
            </div>
            
            <div class="bg-white/20 backdrop-blur-md text-white text-[11px] font-bold px-3 py-1.5 rounded-full border border-white/30 flex items-center space-x-1 shadow-inner">
                <i class="fa-solid fa-comments text-amber-300 text-xs"></i>
                <span>Laporan Warga</span>
            </div>
        </header>

        <!-- Konten Utama: Daftar Rekap Pesan Masuk -->
        <main class="px-6 space-y-5 flex-1 py-6 overflow-y-auto">

            <!-- Bar Pencarian Pesan -->
            <div class="space-y-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                        <i class="fa-solid fa-magnifying-glass text-sm"></i>
                    </span>
                    <input type="text" id="inputCariPesan" oninput="filterDaftarPesan()" placeholder="Cari nama pengirim atau isi pesan..." 
                        class="w-full bg-white border border-gray-200 rounded-2xl pl-11 pr-4 py-3 text-xs font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 shadow-sm transition">
                </div>
            </div>

            <!-- Daftar Rekap Pesan Masuk -->
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Daftar Aspirasi & Pesan Masuk</h3>
                    <span id="badgeJumlahPesan" class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">0 Pesan</span>
                </div>

                <div id="listPesanContainer" class="space-y-3">
                    <div class="bg-white rounded-2xl p-8 border border-gray-200 shadow-sm text-center text-xs text-gray-400">
                        <i class="fa-solid fa-spinner animate-spin mr-2"></i> Memuat daftar pesan...
                    </div>
                </div>
            </div>

        </main>

        <!-- Navigasi Bawah -->
        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-50">
            <nav class="bg-gradient-to-r from-emerald-800 via-emerald-900 to-teal-900 border-t border-emerald-700/60 flex justify-around items-center h-16 px-2 shadow-2xl text-emerald-100">
                <a href="dashboard.html" class="flex flex-col items-center text-emerald-200/70 hover:text-white transition">
                    <i class="fa-solid fa-house text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Beranda</span>
                </a>
                <a href="profil-read.html" class="flex flex-col items-center text-emerald-200/70 hover:text-white transition">
                    <i class="fa-solid fa-id-badge text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Profil</span>
                </a>
                <a href="galeri.html" class="flex flex-col items-center text-emerald-200/70 hover:text-white transition">
                    <i class="fa-solid fa-images text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Galeri</span>
                </a>
                <a href="pesan.html" class="flex flex-col items-center text-emerald-200/70 hover:text-white transition">
                    <i class="fa-regular fa-comment-dots text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Pesan</span>
                </a>
                <a href="dashboard.html" class="flex flex-col items-center text-emerald-200/70 hover:text-white transition">
                    <i class="fa-solid fa-bars-staggered text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Lainnya</span>
                </a>
            </nav>
        </div>

    </div>

    <!-- Script Koneksi Firebase & Logika Rekap Pesan -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyABhd15u0ThpRxw8hGGJJ1qvi2lvNDTLug",
            authDomain: "wargaku-860df.firebaseapp.com",
            projectId: "wargaku-860df",
            storageBucket: "wargaku-860df.firebasestorage.app",
            messagingSenderId: "690711985685",
            appId: "1:690711985685:web:a2d227636b2747b54851c",
            measurementId: "G-CNK6RSPM53"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cachePesan = [];

        async function loadDaftarPesan() {
            const container = document.getElementById('listPesanContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "pesan"));
                cachePesan = [];

                querySnapshot.forEach(docSnap => {
                    cachePesan.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Urutkan berdasarkan waktu terbaru
                cachePesan.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                renderPesan(cachePesan);
            } catch (error) {
                console.error("Gagal memuat pesan:", error);
                container.innerHTML = `<div class="bg-white rounded-2xl p-6 border border-red-100 shadow-sm text-center text-xs text-red-500">Gagal memuat rekap daftar pesan.</div>`;
            }
        }

        function renderPesan(dataList) {
            const container = document.getElementById('listPesanContainer');
            document.getElementById('badgeJumlahPesan').textContent = `${dataList.length} Pesan`;

            if (dataList.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-2xl p-8 border border-gray-200 shadow-sm text-center text-xs text-gray-400">Belum ada aspirasi atau pesan masuk saat ini.</div>`;
                return;
            }

            container.innerHTML = "";
            dataList.forEach(item => {
                let tanggalStr = "Baru saja";
                if (item.createdAt) {
                    const d = new Date(item.createdAt);
                    if (!isNaN(d)) {
                        tanggalStr = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    }
                }

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-4 border border-emerald-100 shadow-sm space-y-2 transition hover:shadow-md";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-md border border-emerald-100">${item.kategori || 'Aspirasi'}</span>
                        <span class="text-[10px] text-gray-400 font-medium">${tanggalStr}</span>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-gray-800"><i class="fa-solid fa-user-circle text-emerald-600 mr-1"></i> ${item.nama || 'Warga'}</h4>
                        <p class="text-xs text-gray-600 mt-1.5 leading-relaxed bg-gray-50 p-3 rounded-xl border border-gray-100">${item.isi}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.filterDaftarPesan = function() {
            const keyword = document.getElementById('inputCariPesan').value.toLowerCase();
            const filtered = cachePesan.filter(item => 
                (item.nama && item.nama.toLowerCase().includes(keyword)) || 
                (item.isi && item.isi.toLowerCase().includes(keyword)) ||
                (item.kategori && item.kategori.toLowerCase().includes(keyword))
            );
            renderPesan(filtered);
        }

        window.onload = () => {
            loadDaftarPesan();
        };
    </script>
</body>
</html>
