<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WargaKu PWA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e90ff">

    <style>
        body {
            background: linear-gradient(135deg, #70a1ff 0%, #1e90ff 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

    <!-- Card Login Glassmorphism -->
    <div class="max-w-sm w-full glass-card rounded-2xl shadow-xl p-8 text-white relative">
        
        <!-- Ikon User -->
        <div class="flex justify-center mb-2">
            <div class="bg-blue-900/40 p-3 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
        </div>

        <h1 class="text-2xl font-semibold text-center mb-6 tracking-wide">User Login</h1>

        <!-- Form Login Terhubung Firebase -->
        <form id="loginForm" class="space-y-4">
            <div>
                <input type="text" id="username" required placeholder="Email / Username" 
                    class="w-full px-4 py-3 rounded-xl bg-white/80 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-inner font-medium">
            </div>
            <div>
                <input type="password" id="password" required placeholder="Password" 
                    class="w-full px-4 py-3 rounded-xl bg-white/80 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-inner font-medium">
            </div>

            <!-- Forgot Password -->
            <div class="text-right">
                <a href="#" onclick="alert('Silakan hubungi Administrator RT untuk reset password.'); return false;" class="text-xs text-white/90 hover:underline">
                    Forgot <span class="text-blue-900 font-medium">Password?</span>
                </a>
            </div>

            <!-- Tombol Login -->
            <button type="submit" id="loginBtn"
                class="w-full py-3 bg-[#0a3d62] hover:bg-[#072d4a] text-white font-semibold rounded-xl shadow-lg transition duration-200 cursor-pointer">
                Login
            </button>
        </form>

        <div id="errorMsg" class="mt-4 text-center text-xs font-semibold text-red-200"></div>
    </div>

    <!-- Skrip Validasi Login Terhubung Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABhd15u0ThpRxw8hGGJJ1qvi2lvNDTLug",
            authDomain: "wargaku-860df.firebaseapp.com",
            projectId: "wargaku-860df",
            storageBucket: "wargaku-860df.firebasestorage.app",
            messagingSenderId: "690711985685",
            appId: "1:690711985685:web:a2d227636b2747b54851c",
            measurementId: "G-CNK6RSPM53"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputUser = document.getElementById('username').value.trim();
            const inputPass = document.getElementById('password').value.trim();

            errorMsg.textContent = 'Memeriksa database...';
            loginBtn.disabled = true;

            try {
                // Query mencari berdasarkan field "email" di koleksi "users"
                const q = query(collection(db, "users"), where("email", "==", inputUser));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    errorMsg.textContent = 'Akun tidak ditemukan di database!';
                    loginBtn.disabled = false;
                    return;
                }

                let userFound = false;
                querySnapshot.forEach((doc) => {
                    const userData = doc.data();
                    
                    // Cek kecocokan password
                    if (userData.password === inputPass) {
                        userFound = true;
                        
                        // SIMPAN DATA ASLI DARI DATABASE KE LOCALSTORAGE
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('userName', userData.nama); // Nama asli (misal: "Kita")
                        localStorage.setItem('userRole', userData.role); // Role asli (misal: "Admin")
                        
                        window.location.href = 'dashboard.html';
                    }
                });

                if (!userFound) {
                    errorMsg.textContent = 'Password salah!';
                    loginBtn.disabled = false;
                }

            } catch (error) {
                console.error("Gagal login:", error);
                errorMsg.textContent = 'Terjadi kesalahan koneksi database.';
                loginBtn.disabled = false;
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker terdaftar:', reg.scope))
                    .catch((err) => console.log('Gagal daftar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
