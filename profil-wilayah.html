<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input & Edit Profil Wilayah - WargaKu PWA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <style>
        body {
            background-color: #f8fafc;
        }
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-20px); opacity: 0; }
        }
        .toast-show {
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast-hide {
            animation: slideOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- ELEMEN CUSTOM TOAST NOTIFICATION -->
    <div id="toastNotification" class="hidden fixed top-5 left-1/2 transform -translate-x-1/2 z-50 max-w-sm w-[90%] bg-gray-900/95 text-white px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center space-x-3 border border-gray-700/50">
        <div class="w-8 h-8 rounded-xl bg-emerald-500 text-white flex items-center justify-center flex-shrink-0 shadow-md">
            <i class="fa-solid fa-check text-sm"></i>
        </div>
        <div class="flex-1">
            <h4 class="text-xs font-bold text-white">Berhasil</h4>
            <p id="toastMessage" class="text-[11px] text-gray-300">Profil wilayah berhasil disimpan!</p>
        </div>
    </div>

    <!-- Kontainer Utama Tampilan Mobile / PWA -->
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col justify-between relative overflow-x-hidden pb-24" style="background-color: #f0fdf4;">
        
        <!-- Header Halaman -->
        <header class="px-6 pt-6 pb-5 flex justify-between items-center bg-gradient-to-br from-emerald-600 via-emerald-700 to-teal-800 sticky top-0 z-40 shadow-lg rounded-b-3xl">
            <div class="flex items-center space-x-3">
                <a href="dashboard.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur-md text-white flex items-center justify-center hover:bg-white/30 transition shadow-inner border border-white/30">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-lg font-bold text-white tracking-wide">Kelola Profil Wilayah</h1>
            </div>
            
            <div class="bg-white/20 backdrop-blur-md text-white text-[11px] font-bold px-3 py-1.5 rounded-full border border-white/30 flex items-center space-x-1 shadow-inner">
                <i class="fa-solid fa-pen-to-square text-amber-300 text-xs"></i>
                <span>Mode Edit</span>
            </div>
        </header>

        <!-- Form Input & Edit Profil Wilayah -->
        <main class="px-6 space-y-6 flex-1 py-6 overflow-y-auto">

            <form id="profilForm" onsubmit="saveProfilWilayah(event)" class="space-y-5 text-xs">
                <input type="hidden" id="docId" value="">

                <!-- Kartu Informasi Singkat -->
                <div class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white rounded-3xl p-6 shadow-lg relative overflow-hidden">
                    <span class="bg-white/20 text-[10px] px-3 py-1 rounded-full font-semibold uppercase tracking-wider inline-block mb-2">Form Pengaturan</span>
                    <h2 class="text-base font-bold">Update Data Wilayah RT</h2>
                    <p class="text-xs text-emerald-100 mt-1">Data wilayah telah dimuat ke form di bawah. Silakan ubah sesuai kebutuhan dan simpan.</p>
                </div>

                <!-- Input Detail Informasi Wilayah -->
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-emerald-100 space-y-4">
                    <div class="flex items-center space-x-2 text-gray-800 font-bold text-sm pb-3 border-b border-gray-100">
                        <i class="fa-solid fa-table-cells text-emerald-600"></i>
                        <span>UBAH INFORMASI WILAYAH</span>
                    </div>

                    <div class="space-y-3.5">
                        <div>
                            <label class="block font-bold text-gray-600 mb-1">Alamat / Dukuh</label>
                            <input type="text" id="inputDukuh" value="Potrobayan" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" required>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold text-gray-600 mb-1">Nomor RT</label>
                                <input type="text" id="inputRt" value="02" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" required>
                            </div>
                            <div>
                                <label class="block font-bold text-gray-600 mb-1">Nomor RW</label>
                                <input type="text" id="inputRw" value="01" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" required>
                            </div>
                        </div>

                        <div>
                            <label class="block font-bold text-gray-600 mb-1">Kode Pos</label>
                            <input type="text" id="inputKodePos" value="55771" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition">
                        </div>

                        <div>
                            <label class="block font-bold text-gray-600 mb-1">Desa / Kalurahan</label>
                            <input type="text" id="inputKalurahan" value="Srihardono" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" required>
                        </div>

                        <div>
                            <label class="block font-bold text-gray-600 mb-1">Kecamatan</label>
                            <input type="text" id="inputKecamatan" value="Pundong" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" required>
                        </div>

                        <div>
                            <label class="block font-bold text-gray-600 mb-1">Kabupaten / Kota</label>
                            <input type="text" id="inputKabupaten" value="Bantul" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" required>
                        </div>

                        <div>
                            <label class="block font-bold text-gray-600 mb-1">Provinsi</label>
                            <input type="text" id="inputProvinsi" value="Yogyakarta" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition" required>
                        </div>
                    </div>
                </div>

                <!-- Input Tentang Wilayah -->
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-emerald-100 space-y-3">
                    <div class="flex items-center space-x-2 text-gray-800 font-bold text-sm pb-2 border-b border-gray-100">
                        <i class="fa-solid fa-circle-info text-emerald-600"></i>
                        <span>UBAH CATATAN WILAYAH</span>
                    </div>
                    <div>
                        <textarea id="inputTentang" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition">Profil wilayah RT 02 Potrobayan merupakan lingkungan yang asri dan aktif. Tetap Semangat menjaga kerukunan warga!</textarea>
                    </div>
                </div>

                <!-- Tombol Simpan -->
                <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-emerald-600/30 cursor-pointer flex items-center justify-center space-x-2 text-sm">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>SIMPAN PERUBAHAN</span>
                </button>
            </form>

        </main>

        <!-- Navigasi Bawah -->
        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-50">
            <nav class="bg-gradient-to-r from-emerald-800 via-emerald-900 to-teal-900 border-t border-emerald-700/60 flex justify-around items-center h-16 px-2 shadow-2xl text-emerald-100">
                <a href="dashboard.html" class="flex flex-col items-center text-emerald-200/70 hover:text-white transition">
                    <i class="fa-solid fa-house text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Beranda</span>
                </a>
                
                <a href="profil-read.html" class="flex flex-col items-center text-emerald-200/70 hover:text-white transition">
                    <i class="fa-solid fa-id-badge text-lg"></i>
                    <span class="text-[10px] mt-1">Profil</span>
                </a>

                <a href="#" onclick="alert('Menu Galeri'); return false;" class="flex flex-col items-center text-emerald-200/70 hover:text-white transition">
                    <i class="fa-solid fa-images text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Galeri</span>
                </a>
                <a href="#" onclick="alert('Pesan'); return false;" class="flex flex-col items-center text-emerald-200/70 hover:text-white transition">
                    <i class="fa-regular fa-comment-dots text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Pesan</span>
                </a>
                <a href="dashboard.html" class="flex flex-col items-center text-emerald-200/70 hover:text-white transition">
                    <i class="fa-solid fa-bars-staggered text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Lainnya</span>
                </a>
            </nav>
        </div>

    </div>

    <!-- Script Koneksi Database Firebase Firestore (Simpan & Edit) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyABhd15u0ThpRxw8hGGJJ1qvi2lvNDTLug",
            authDomain: "wargaku-860df.firebaseapp.com",
            projectId: "wargaku-860df",
            storageBucket: "wargaku-860df.firebasestorage.app",
            messagingSenderId: "690711985685",
            appId: "1:690711985685:web:a2d227636b2747b54851c",
            measurementId: "G-CNK6RSPM53"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = message;
            
            toast.classList.remove('hidden', 'toast-hide');
            toast.classList.add('toast-show');

            setTimeout(() => {
                toast.classList.remove('toast-show');
                toast.classList.add('toast-hide');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 300);
            }, 2500);
        }

        // Fungsi ambil data dari database dengan pencarian koleksi menyeluruh
        async function loadProfilUntukEdit() {
            try {
                // Daftar nama koleksi yang mungkin dipakai di database Anda
                const collectionsToTry = ["profil-wilayah", "profil_wilayah", "profil", "wilayah"];
                let foundData = false;

                for (const colName of collectionsToTry) {
                    const querySnapshot = await getDocs(collection(db, colName));
                    if (!querySnapshot.empty) {
                        const docSnap = querySnapshot.docs[0];
                        const data = docSnap.data();
                        
                        document.getElementById('docId').value = docSnap.id;
                        document.getElementById('inputDukuh').value = data.dukuh || data.namaDukuh || "Potrobayan";
                        document.getElementById('inputRt').value = data.rt || "02";
                        document.getElementById('inputRw').value = data.rw || "01";
                        document.getElementById('inputKodePos').value = data.kodePos || "55771";
                        document.getElementById('inputKalurahan').value = data.kelurahan || data.kalurahan || "Srihardono";
                        document.getElementById('inputKecamatan').value = data.kecamatan || "Pundong";
                        document.getElementById('inputKabupaten').value = data.kabupaten || data.kabupatenKota || "Bantul";
                        document.getElementById('inputProvinsi').value = data.provinsi || "Yogyakarta";
                        document.getElementById('inputTentang').value = data.tentang || data.keterangan || `Profil wilayah RT 02 Potrobayan merupakan lingkungan yang asri dan aktif. Tetap Semangat menjaga kerukunan warga!`;
                        
                        foundData = true;
                        break;
                    }
                }

                if (!foundData) {
                    console.log("Data tidak ditemukan di database, menggunakan data default.");
                }
            } catch (error) {
                console.error("Gagal memuat data profil dari database:", error);
            }
        }

        window.saveProfilWilayah = async function(e) {
            e.preventDefault();
            const docId = document.getElementById('docId').value;

            const profilData = {
                dukuh: document.getElementById('inputDukuh').value,
                rt: document.getElementById('inputRt').value,
                rw: document.getElementById('inputRw').value,
                kodePos: document.getElementById('inputKodePos').value,
                kelurahan: document.getElementById('inputKalurahan').value,
                kecamatan: document.getElementById('inputKecamatan').value,
                kabupaten: document.getElementById('inputKabupaten').value,
                provinsi: document.getElementById('inputProvinsi').value,
                tentang: document.getElementById('inputTentang').value,
                updatedAt: new Date().toISOString()
            };

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-2"></i> Menyimpan...`;

            try {
                // Simpan konsisten ke koleksi "profil-wilayah" (atau "profil_wilayah")
                if (!docId || docId === "") {
                    await addDoc(collection(db, "profil-wilayah"), profilData);
                    showToast('Profil wilayah berhasil ditambahkan!');
                } else {
                    const docRef = doc(db, "profil-wilayah", docId);
                    await updateDoc(docRef, profilData);
                    showToast('Profil wilayah berhasil diperbarui!');
                }

                setTimeout(() => {
                    window.location.href = 'profil-read.html';
                }, 1500);

            } catch (error) {
                console.error("Gagal menyimpan profil:", error);
                alert("Terjadi kesalahan saat menyimpan ke database.");
                submitBtn.disabled, submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            }
        }

        window.onload = () => {
            loadProfilUntukEdit();
        };
    </script>
</body>
</html>
